<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assigment Session 3</title>
    <link rel="stylesheet" href="../Assigment/CSS/styl.css">
</head>
<body>
    <section class="section">
        <div class="div1">
            <h2>Welcome</h2>
            <p>Contact us securely to get the information you need about our website.</p>
            <p>Register in the form (your information is confidential)</p>
        </div><!--
        --><div class="div2">
            <h1>Contact</h1>
            <p>*Required</p>
         <div>
            <input type="text" id="name" name="name" pattern="[A-Za-z\s]+" placeholder="Your Name" required>
            <input type="email" id="email" name="email" placeholder="example@email.com" required>
            <input type="text" id="company" name="company" pattern="[A-Za-z\s]+" placeholder="Your company" required>
            <input type="tel" id="phone" name="phone" maxlength="11" pattern="01(0|1|2|5)[0-9]{8}" placeholder="011-456-7890" title="Enter only numbers" required>
            <textarea id="message" name="message" rows="4" cols="25" placeholder="Your message here..."></textarea>
         <div>
            <input type="submit" value="Submit">
         </div>
         </div>

        </div>
        
    </section>

</body>
</html>
